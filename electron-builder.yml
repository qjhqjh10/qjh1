appId: com.qingjian.ai-writing
productName: AI写作软件—青剑
directories:
  output: release
files:
  - dist
  - dist-electron
  - package.json
win:
  target:
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI写作软件—青剑
extraResources:
  - from: .aiharness/templates
    to: .aiharness/templates
  - from: .aiharness/rules
    to: .aiharness/rules
  - from: .aiharness/aiharness.json
    to: .aiharness/aiharness.json
  - from: .aiharness/AGENTS.md
    to: .aiharness/AGENTS.md
