appId: com.qingjian.ai-writing
productName: AI写作软件—青剑
directories:
  output: release
files:
  - dist
  - dist-electron
  - package.json
win:
  target:
    - portable
  # v14.7.0: 跳过 exe 编辑/签名——winCodeSign 7z 在普通权限下解压 macOS 软链接失败
  # （历史事故），导致构建中断、产物缺文件；个人项目无签名证书，exe 用默认图标/无版本信息
  # （memory 记录"属性里不显示版本号，功能完全不受影响"即此状态）
  signAndEditExecutable: false
  # v16.3.1(审计 S7): nsis 段已删除——win.target 仅 portable，从不走 nsis 安装流程（死配置）
# v15.0.0: scripts 空目录已移除（无运行时依赖，git 零追踪）
extraResources:
  - from: .aiharness/templates
    to: .aiharness/templates
  - from: .aiharness/rules
    to: .aiharness/rules
  - from: .aiharness/aiharness.json
    to: .aiharness/aiharness.json
  - from: .aiharness/AGENTS.md
    to: .aiharness/AGENTS.md
