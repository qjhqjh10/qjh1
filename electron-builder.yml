appId: com.qingjian.ai-writing
productName: AI写作软件—青剑
directories:
  output: release
files:
  - dist
  - dist-electron
  - package.json
win:
  target:
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI写作软件—青剑
extraResources:
  - from: projects/
    to: projects/
    filter:
      - "**/*"
  - from: knowledge_base/
    to: knowledge_base/
    filter:
      - "**/*"
  - from: scene_templates/
    to: scene_templates/
    filter:
      - "**/*"
  - from: style_projects/
    to: style_projects/
    filter:
      - "**/*"
