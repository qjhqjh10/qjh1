appId: com.novel-writing.app
productName: AI小说写作助手
directories:
  buildResources: build
  output: release
files:
  - dist
  - dist-electron
  - package.json
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI小说写作助手
extraResources:
  - from: projects/
    to: projects/
    filter:
      - "**/*"
