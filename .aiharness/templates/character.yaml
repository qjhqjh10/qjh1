id: lin_yi
name: 林逸
role: 男主
gender: 男
age: "18"
occupation: 青云宗内门弟子·剑修
background: >-
  出身于东荒边陲小镇，幼年父母双亡，被青云宗外门长老收养。
  自幼习剑，天赋平平，在宗门中默默无闻。直到十六岁那年，
  在禁地试炼中意外获得上古剑仙传承——青冥古剑，人生从此改变。
appearance: >-
  身形修长，面容清秀但目光锐利。常年着青色道袍，腰佩青冥剑。
  修炼之后肤色微微泛着玉质光泽，举止间有股不容忽视的锋锐之气。
personality: >-
  外表看似温和寡言，实则内心坚韧，有着不服输的傲骨。
  对朋友重情重义，对敌人冷酷决绝。经历多次背叛后变得愈发谨慎，
  内心深处始终保留着少年的纯真与侠义。
abilities: >-
  筑基期剑修，灵力已凝练为真元。可御剑飞行，施展基础剑诀。
  剑气可外放丈余，感知范围覆盖百步。
  觉醒剑魂后可短暂进入"人剑合一"状态，战力暴增至金丹期。
  剑道天赋优异，领悟力远超同阶。
weaknesses: >-
  重情义容易被利用，曾因此多次陷入险境。
  剑魂初醒时不稳，关键时刻可能失控。
  筑基期底蕴尚浅，持久战有劣势。
relationships: >-
  苏婉清: 青梅竹马，暗生情愫，但碍于身份差距未曾表白。
  陈啸天: 宗门首席弟子，表面上的死对头，实则被利用。
  师父李道玄: 青云宗外门长老，林逸的养父和引路人。
  冷月: 魔道女子，禁地中偶遇，神秘而危险。
relationshipTags:
  - 主角
  - 剑修
  - 剑魂继承者
arc: >-
  初始阶段: 弱小但坚韧的少年，在宗门底层挣扎求存。
  觉醒阶段: 获得力量后的迷茫与责任，面临正邪两道的威胁。
  成长阶段: 经历师父陨落后真正成熟，开始掌握自己的命运。
  巅峰阶段: 剑道大成，统一正邪两道。
importance: 95
