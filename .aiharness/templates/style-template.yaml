# 风格模板 — 27维度完整格式（全类型通用参考）
# 存储于 style_templates/ 目录（YAML格式）
# 各小说类型的专属模板见 style_templates/ 目录
# 实际创建模板时请优先读 style_templates/{类型}.yaml（先读 INDEX.yaml）
# 必填: name、type、dimensions
# dimensions 中每维格式: {description, examples[], writingRules[], vocabularyList[]}
# 11必填维(任何小说必分析) + 2可选维 + 9情色专属 + 5类型专属 = 27维
name: 示例都市文艺风格
type: 都市小说

dimensions:
  # ═══ 11 必填维 ═══
  narrativeTone:
    description: 100-300字叙事基调分析，情感底色/态度/氛围
    examples:
      - "原文例句1 — 展示基调的典型句子"
      - "原文例句2"
      - "原文例句3 — 至少3条"
    writingRules:
      - 基于此基调的具体写作规则1
      - 写作规则2
      - 写作规则3 — 至少3条
    vocabularyList:
      - 高频词1、高频词2、高频词3、高频词4、高频词5
      - 高频词6、高频词7、高频词8、高频词9、高频词10 — 至少10个

  sentenceStyle:
    description: 长短句范围/交替模式/标点习惯
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  vocabularyStyle:
    description: 文白比例/高频词类/成语典故习惯
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  rhetoricStyle:
    description: 比喻类型和频率/排比使用/通感手法
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  rhythmStyle:
    description: 场景切换频率/快慢段落比/高潮占比
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  dialogueStyle:
    description: 对白占全文比例/语气特点/人物语言差异程度
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  moodStyle:
    description: 情绪基调/色调冷暖/环境与心理的映射关系
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  perspectiveStyle:
    description: 人称/视角/切换频率/内心独白占比
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  bodyLanguageStyle:
    description: 身体部位描写频率/扫描顺序/习惯动作
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  sensoryStyle:
    description: 五感比例/感官打包模式/各类感官词汇库
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

  descriptionPattern:
    description: 描写固定顺序/人物出场模板/场景铺陈习惯
    examples: ["原文例句1", "原文例句2", "原文例句3"]
    writingRules: ["规则1", "规则2", "规则3"]
    vocabularyList: ["词1", "词2", "词3", "词4", "词5", "词6", "词7", "词8", "词9", "词10"]

