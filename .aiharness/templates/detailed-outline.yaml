# 细纲模板 — 每章一个YAML文件，纯YAML格式
# order 从0开始 (第1章 order=0)
# 多行文本用 | 或 >- 块标量，禁止YAML内直接换行
id: chapter1
title: 觉醒之日
order: 0
status: complete

plotOverview: >-
  宗门大比日，林逸对战首席弟子陈啸天。战斗燃眉之际，
  丹田内沉睡的剑魂意外苏醒，一道青芒冲天而起震惊全场。
  虽然最终不敌金丹期的陈啸天，但林逸展现出的剑道天赋
  引起了宗门高层的关注。大比结束后，陈长老一脉开始在
  暗处密谋，派出心腹监视林逸的一举一动。

characters: |
  林逸(紧张→坚定，剑魂觉醒后茫然但兴奋)
  陈啸天(轻蔑→震惊，被林逸爆发所撼动)
  苏婉清(担忧，场边观战，林逸危险时忍不住惊呼)
  陈长老(阴狠，暗中观察，赛后立即召见心腹部署)
  李道玄师父(欣慰且忧虑，察觉到暗流涌动)

location: 青云宗演武场·擂台区

keyEvents: |
  - 宗门大比开幕，数百弟子齐聚演武场
  - 林逸抽签对上首席弟子陈啸天，众人不看好
  - 擂台上两人激战，陈啸天金丹修为碾压
  - 林逸濒危之际剑魂觉醒，青芒冲天震惊全场
  - 林逸短暂爆发后力竭落败，但赢得尊重
  - 陈长老赛后密召心腹，开始部署打压计划

eroticContent: ''

customContent: >-
  本章是故事起点，需要同时完成三项任务:
  1. 建立主角的处境(底层弟子，天赋平平)
  2. 引入核心冲突(剑魂觉醒 vs 宗门打压)
  3. 埋下伏笔(陈长老的暗线、苏婉清的来历)

  节奏控制: 前两节铺垫，第三节开始比武，第四节剑魂觉醒高潮，第五节收尾埋伏笔。

emotionCurve:
  - position: 开篇
    emotion: 平淡
    description: 日常场景铺陈
  - position: 比武开始
    emotion: 紧张
    description: 实力悬殊带来的压迫感
  - position: 剑魂觉醒
    emotion: 震撼
    description: 全场震惊的高潮时刻
  - position: 落败
    emotion: 遗憾但希望
    description: 虽败犹荣，埋下希望
  - position: 暗潮
    emotion: 不安
    description: 陈长老的密谋带来阴影

writingNotes:
  perspective: 第三人称跟随林逸
  pacing: 慢-快-慢三节奏
  sensory: 视觉为主(擂台、青芒)，听觉为辅(鼓声、惊呼)
  foreshadowing: 陈长老密谋为第3章铺垫；苏婉清的身份首次暗示
